<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1a17"/>
      <stop offset="100%" stop-color="#0a1310"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8fa89e"/>
    </marker>
    <marker id="arrowDim" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c98a3c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="url(#bg)" rx="16"/>

  <text x="450" y="42" text-anchor="middle" fill="#f4efe6" font-size="20" font-weight="700">How a question becomes an answer</text>
  <text x="450" y="64" text-anchor="middle" fill="#8fa89e" font-size="12">5-step LangGraph agent — every hop is logged and shown in the app's trace view</text>

  <!-- Zone: Understanding -->
  <rect x="40" y="92" width="820" height="90" rx="12" fill="#132420" stroke="#2a4038" stroke-width="1"/>
  <text x="58" y="112" fill="#6f9b86" font-size="11" font-weight="700" letter-spacing="1">UNDERSTANDING</text>

  <rect x="70" y="122" width="220" height="46" rx="10" fill="#1d3a63" stroke="#2f5490"/>
  <text x="180" y="150" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">🔀 route_intent</text>

  <!-- Zone: Retrieval -->
  <rect x="40" y="200" width="820" height="150" rx="12" fill="#241708" stroke="#4a3216" stroke-width="1"/>
  <text x="58" y="220" fill="#c98a3c" font-size="11" font-weight="700" letter-spacing="1">RETRIEVAL</text>

  <rect x="70" y="230" width="220" height="46" rx="10" fill="#8a4a12" stroke="#c9761f"/>
  <text x="180" y="258" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">🔍 search_index</text>

  <rect x="70" y="300" width="220" height="46" rx="10" fill="#3c3f44" stroke="#5c6066"/>
  <text x="180" y="328" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">⚖️ resolve_conflict</text>

  <!-- Zone: Generation -->
  <rect x="40" y="368" width="820" height="90" rx="12" fill="#1f1730" stroke="#3a2c56" stroke-width="1"/>
  <text x="58" y="388" fill="#a98fd9" font-size="11" font-weight="700" letter-spacing="1">GENERATION</text>

  <rect x="70" y="398" width="220" height="46" rx="10" fill="#5b3d92" stroke="#8E75B2"/>
  <text x="180" y="426" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">✍️ synthesize_answer</text>

  <!-- Zone: Output -->
  <rect x="40" y="476" width="820" height="90" rx="12" fill="#0e2418" stroke="#1e4530" stroke-width="1"/>
  <text x="58" y="496" fill="#6bbf8f" font-size="11" font-weight="700" letter-spacing="1">OUTPUT</text>

  <rect x="70" y="506" width="220" height="46" rx="10" fill="#1e6b3e" stroke="#2f9a58"/>
  <text x="180" y="534" text-anchor="middle" fill="#fff" font-size="14" font-weight="600">📦 aggregate_output</text>

  <!-- Main flow arrows (vertical) -->
  <line x1="180" y1="168" x2="180" y2="230" stroke="#8fa89e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="276" x2="180" y2="300" stroke="#8fa89e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="346" x2="180" y2="398" stroke="#8fa89e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="180" y1="444" x2="180" y2="506" stroke="#8fa89e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Right-side annotation panel -->
  <text x="360" y="150" fill="#c7d6cf" font-size="12">Hinglish/English → clean search intent</text>
  <text x="360" y="258" fill="#c7d6cf" font-size="12">Vector search over ingested circulars</text>
  <text x="360" y="328" fill="#c7d6cf" font-size="12">Old vs. current rule labeled, never blended</text>
  <text x="360" y="426" fill="#c7d6cf" font-size="12">Answers only from retrieved context — or says so</text>
  <text x="360" y="534" fill="#c7d6cf" font-size="12">Answer + citations + full trace for the UI</text>

  <!-- Retry loop -->
  <path d="M 300 253 C 380 253, 380 145, 300 145" fill="none" stroke="#c98a3c" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowDim)"/>
  <text x="392" y="200" fill="#c98a3c" font-size="11" font-weight="600">no results →</text>
  <text x="392" y="215" fill="#c98a3c" font-size="11" font-weight="600">retry, capped by</text>
  <text x="392" y="230" fill="#c98a3c" font-size="11" font-weight="600">max_loops guard</text>

  <!-- Legend -->
  <text x="700" y="590" fill="#5c7268" font-size="11">Click "How this was generated" in-app to see this run live →</text>
</svg>
